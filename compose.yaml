name: ga-server

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=medplum
      - POSTGRES_PASSWORD=medplum
    volumes:
      - ga-postgres:/var/lib/postgresql/data
    command:
      - 'postgres'
      - '-c'
      - 'listen_addresses=*'
      - '-c'
      - 'statement_timeout=60000'
      - '-c'
      - 'default_transaction_isolation=REPEATABLE READ'
      - '-c'
      - 'shared_preload_libraries=pg_stat_statements,auto_explain'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U medplum']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    command: redis-server --requirepass medplum
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'medplum', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Named volumes are created root-owned; medplum-server runs as uid 1000 and must write Binaries.
  # Reuses the redis image for chown so no extra image is pulled.
  binary-perms:
    image: redis:7
    user: root
    command: ['chown', '1000:1000', '/binary']
    volumes:
      - ga-binary:/binary

  medplum-server:
    image: medplum/medplum-server:5.2.14
    restart: unless-stopped
    depends_on:
      binary-perms:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '127.0.0.1:8103:8103'
    command: ['env']
    volumes:
      - ga-binary:/usr/src/medplum/binary
    environment:
      MEDPLUM_PORT: 8103
      MEDPLUM_BASE_URL: 'http://localhost:8103/'
      MEDPLUM_APP_BASE_URL: 'http://localhost:3000/'
      MEDPLUM_STORAGE_BASE_URL: 'http://localhost:8103/storage/'
      MEDPLUM_DATABASE_HOST: 'postgres'
      MEDPLUM_DATABASE_PORT: 5432
      MEDPLUM_DATABASE_DBNAME: 'medplum'
      MEDPLUM_DATABASE_USERNAME: 'medplum'
      MEDPLUM_DATABASE_PASSWORD: 'medplum'
      MEDPLUM_REDIS_HOST: 'redis'
      MEDPLUM_REDIS_PORT: 6379
      MEDPLUM_REDIS_PASSWORD: 'medplum'
      MEDPLUM_BINARY_STORAGE: 'file:./binary/'
      MEDPLUM_SUPPORT_EMAIL: '"GA" <ga@localhost>'
      MEDPLUM_MAX_JSON_SIZE: '1mb'
      MEDPLUM_MAX_BATCH_SIZE: '50mb'
      MEDPLUM_DEFAULT_FHIR_QUOTA: '10000000' # per login per minute; Medplum's 50,000 stops large imports by GA's ordinary (non-super-admin) login
      MEDPLUM_VM_CONTEXT_BOTS_ENABLED: 'false'
      MEDPLUM_ALLOWED_ORIGINS: 'http://localhost:3000'
      MEDPLUM_INTROSPECTION_ENABLED: 'true'
      MEDPLUM_SHUTDOWN_TIMEOUT_MILLISECONDS: 30000
    healthcheck:
      # image has no curl/wget; use node fetch
      test:
        [
          'CMD',
          'node',
          '-e',
          'fetch("http://localhost:8103/healthcheck").then(r => r.json()).then(console.log).catch(() => { process.exit(1); })',
        ]
      interval: 30s
      timeout: 10s
      retries: 5

  medplum-app:
    image: medplum/medplum-app:5.2.14
    restart: unless-stopped
    depends_on:
      medplum-server:
        condition: service_healthy
    ports:
      - '127.0.0.1:3000:3000'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000']
      interval: 10s
      timeout: 5s
      retries: 5

  # GA's own store (not yet for use; Medplum is the default): the one process that opens .ga/store/ga.db, served to the others
  # with the token in .ga/store/token. Off unless the sqlite profile is on (docker compose --profile sqlite up -d); GA uses it
  # when .ga/config.json says "store": "sqlite". Same image, user and mounts as ga-sync; published on the host's loopback for the
  # host CLI and the stdio MCP. store-serve.ts runs directly (not via cli.ts): about 60 MB less memory.
  ga-store:
    image: node:26.13.0-alpine
    profiles: ['sqlite']
    restart: unless-stopped
    init: true
    user: '${UID:-1000}:${GID:-1000}'
    working_dir: /ga
    ports:
      - '127.0.0.1:8120:8120'
    volumes:
      - .:/ga:ro
      - ./.ga:/ga/.ga
    environment:
      GA_CONFIG: /ga/.ga/config.json
      GA_STORE_HOST: 0.0.0.0
    command: ['node', '--max-old-space-size=192', 'src/store-serve.ts']
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8120/healthz'] # busybox wget: no second node process
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Daily SMART sync (ga sync --daemon): the repo's own code on the pinned Node image; repo read-only, .ga writable.
  # user: the host uid:gid so files under .ga stay yours (export UID/GID or put them in .env; macOS Docker Desktop maps ownership anyway).
  ga-sync:
    image: node:26.13.0-alpine
    restart: unless-stopped
    init: true # PID 1 that forwards SIGTERM, so docker compose stop is immediate
    user: '${UID:-1000}:${GID:-1000}'
    depends_on:
      medplum-server:
        condition: service_healthy
      ga-store:
        condition: service_started # not healthy: an unused ga-store must never hold these back
        required: false # off on a default install (sqlite profile)
    working_dir: /ga
    volumes:
      - .:/ga:ro
      - ./.ga:/ga/.ga
    environment:
      GA_CONFIG: /ga/.ga/config.json
      GA_BASE_URL: 'http://medplum-server:8103/'
      GA_STORE_URL: 'http://ga-store:8120/'
      TZ: ${TZ:-UTC} # the host's zone (setup.sh writes it to .env): local days for imports, Apple daily totals, share dates and "today"
    command: ['node', 'src/cli.ts', 'sync', '--daemon']

  # The one public service (ga gateway serve): share links, /callback, and with GA_PUBLIC_URL chat-app access (OAuth, /mcp).
  # Same image, user and mounts as ga-sync. Tailscale Funnel on the host proxies to 127.0.0.1:8110.
  ga-gateway:
    image: node:26.13.0-alpine
    restart: unless-stopped
    # Fixed, and only here: a recreated gateway (same pid) then recognises an import lock its previous instance left (src/lock.ts).
    hostname: ga-gateway
    init: true
    user: '${UID:-1000}:${GID:-1000}'
    depends_on:
      medplum-server:
        condition: service_healthy
      ga-store:
        condition: service_started # not healthy: an unused ga-store must never hold these back
        required: false # off on a default install (sqlite profile)
    working_dir: /ga
    ports:
      - '127.0.0.1:8110:8110'
    extra_hosts:
      - 'host.docker.internal:host-gateway' # a local LLM server (Ollama) on Linux; Docker Desktop has it built in
    volumes:
      - .:/ga:ro
      - ./.ga:/ga/.ga
    environment:
      GA_CONFIG: /ga/.ga/config.json
      GA_BASE_URL: 'http://medplum-server:8103/'
      GA_STORE_URL: 'http://ga-store:8120/'
      TZ: ${TZ:-UTC} # the host's zone (setup.sh writes it to .env): local days for imports, Apple daily totals, share dates and "today"
      GA_SHARE_HOST: 0.0.0.0
      GA_PUBLIC_URL: ${GA_PUBLIC_URL:-}
      GA_LLM_BASE_URL: ${GA_LLM_BASE_URL:-}
      GA_LLM_API_KEY: ${GA_LLM_API_KEY:-}
      GA_LLM_MODEL: ${GA_LLM_MODEL:-}
    command: ['node', 'src/cli.ts', 'gateway', 'serve']

  # Nightly backup (scripts/backup.sh): database, stored files and .ga to GA_BACKUP_DIR, newest 7 kept. Two services, one per
  # store (ga-backup-store only with the sqlite profile); each skips a run when .ga/config.json names the other store.
  # Backups hold all health records: keep the directory on an encrypted disk. Same user as ga-sync so files stay yours.
  ga-backup:
    image: postgres:16
    restart: unless-stopped
    init: true
    user: '${UID:-1000}:${GID:-1000}'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: medplum # same as POSTGRES_PASSWORD above
      BACKUP_STORE: medplum
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - ga-binary:/ga-binary:ro
      - ./.ga:/dot-ga:ro
      - ${GA_BACKUP_DIR:-./backups}:/backups
    command: ['sh', '/backup.sh']

  # SQLite store: an online copy of .ga/store/ga.db (VACUUM INTO) while ga-store keeps running. .ga is read-write here:
  # a second connection to a live WAL database writes ga.db-shm.
  ga-backup-store:
    image: node:26.13.0-alpine
    profiles: ['sqlite']
    restart: unless-stopped
    init: true
    user: '${UID:-1000}:${GID:-1000}'
    depends_on:
      ga-store:
        condition: service_started
    environment:
      BACKUP_STORE: sqlite
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - ./.ga:/dot-ga
      - ${GA_BACKUP_DIR:-./backups}:/backups
    command: ['sh', '/backup.sh']

volumes:
  ga-postgres:
  ga-binary:
